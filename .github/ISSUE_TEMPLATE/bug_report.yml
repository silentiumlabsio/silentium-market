name: Bug report
description: Report a reproducible SilentiumMarket issue using sanitized information.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: SilentiumMarket version
      placeholder: "Example: v10.3.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - RuneLite cockpit
        - GE Workstation
        - MAX / Plan Builder
        - Dashboard
        - Profit Tracker
        - Watchlist / Search
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the behavior without including credentials, tokens, private paths, or sensitive account data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction steps
      description: Keep the steps minimal and sanitized.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, session information, private paths, account-sensitive information, and unsanitized logs/screenshots.
          required: true
